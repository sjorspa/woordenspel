<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Woordenspel</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
</head>

<body>
    <div id="app">
        <div class="loading">Woordenspel laden…</div>
    </div>

    <div id="blazor-error-ui">
        Er ging iets mis.
        <a href="." class="reload">Opnieuw laden</a>
        <span class="dismiss">🗙</span>
    </div>
    <script>
        // Firefox start alleen een sleepactie als er gegevens aan hangen.
        document.addEventListener("dragstart", e => e.dataTransfer?.setData("text/plain", ""));
    </script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
